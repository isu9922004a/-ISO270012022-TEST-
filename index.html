<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISO 27001 主導稽核員模擬考</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background: #0b1726;
      color: #ffffff;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 24px;
    }

    .card {
      background: #13283d;
      border: 1px solid #294866;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 8px;
    }

    h2 {
      margin-top: 0;
    }

    .sub {
      color: #a9bfd2;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin: 6px 6px 6px 0;
    }

    .primary {
      background: #38d4b4;
      color: #06231d;
    }

    .secondary {
      background: #244664;
      color: #ffffff;
    }

    .warning {
      background: #ffd166;
      color: #332500;
    }

    .hidden {
      display: none;
    }

    .question {
      background: #13283d;
      border: 1px solid #294866;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .question-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .option {
      display: block;
      padding: 10px;
      margin: 7px 0;
      border: 1px solid #365876;
      border-radius: 9px;
      background: #0c1d2e;
    }

    .option:hover {
      background: #17344f;
    }

    .correct {
      background: #17452b !important;
      border-color: #51d37f !important;
    }

    .wrong {
      background: #4b222c !important;
      border-color: #ff6b7a !important;
    }

    .explain {
      margin-top: 12px;
      padding: 12px;
      background: #0d3134;
      border-radius: 9px;
    }

    .score {
      font-size: 48px;
      font-weight: bold;
      color: #5ee08b;
    }

    .unit-result {
      padding: 8px 0;
      border-bottom: 1px solid #294866;
    }

    .timer {
      position: sticky;
      top: 0;
      background: #081523;
      padding: 12px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      z-index: 10;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .info-box {
      background: #13283d;
      border: 1px solid #294866;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }

    .info-box b {
      font-size: 26px;
      display: block;
    }

    @media (max-width: 700px) {
      .info-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<div id="home" class="container">

  <div class="card">
    <h1>🛡️ ISO/IEC 27001:2022</h1>
    <h2>主導稽核員模擬考試系統</h2>

    <p class="sub">
      依正式考試大綱出題。
      每回正式模擬考 40 題，考試時間 105 分鐘。
    </p>
  </div>

  <div class="info-grid">
    <div class="info-box">
      <b id="bankCount">0</b>
      題庫總數
    </div>

    <div class="info-box">
      <b>40</b>
      正式模擬題數
    </div>

    <div class="info-box">
      <b>105</b>
      分鐘
    </div>

    <div class="info-box">
      <b>80%</b>
      及格門檻
    </div>
  </div>

  <div class="card" style="margin-top:20px">
    <h2>正式考試比例</h2>

    <p>第一單元｜管理系統概念與原則：6 題</p>
    <p>第二單元｜稽核概念與稽核員責任：6 題</p>
    <p>第三單元｜稽核規劃：6 題</p>
    <p>第四單元｜稽核執行：14 題 🔥</p>
    <p>第五單元｜稽核報告與結束：8 題 🔥</p>
  </div>

  <div class="card">

    <button class="primary" onclick="startOfficial()">
      開始正式模擬考
    </button>

    <button class="secondary" onclick="startPractice(80)">
      80 題強化練習
    </button>

    <button class="warning" onclick="startWrong()">
      錯題重練
    </button>

  </div>

  <div class="card">
    <h2>單元專攻</h2>

    <button class="secondary" onclick="startUnit(1)">單元1</button>
    <button class="secondary" onclick="startUnit(2)">單元2</button>
    <button class="secondary" onclick="startUnit(3)">單元3</button>
    <button class="secondary" onclick="startUnit(4)">單元4</button>
    <button class="secondary" onclick="startUnit(5)">單元5</button>
  </div>

</div>


<div id="exam" class="hidden">

  <div class="timer" id="timer">
    105:00
  </div>

  <div class="container">

    <div class="card">

      <h2 id="modeTitle">
        模擬考
      </h2>

      <div id="questions"></div>

      <button class="primary" onclick="submitExam()">
        送出答案＋查看解析
      </button>

      <button class="secondary" onclick="backHome()">
        返回首頁
      </button>

    </div>

    <div id="result" class="card hidden"></div>

  </div>

</div>


<script src="questions.js"></script>

<script>

const OFFICIAL_COUNTS = {
  1: 6,
  2: 6,
  3: 6,
  4: 14,
  5: 8
};

let currentQuestions = [];
let answers = {};
let timeLeft = 0;
let timerID = null;

document.getElementById("bankCount").innerText =
  window.QUESTION_BANK.length;


function shuffle(arr) {

  let copy = [...arr];

  for (let i = copy.length - 1; i > 0; i--) {

    const j =
      Math.floor(Math.random() * (i + 1));

    [copy[i], copy[j]] =
      [copy[j], copy[i]];
  }

  return copy;
}


function sample(arr, count) {

  return shuffle(arr).slice(
    0,
    Math.min(count, arr.length)
  );
}


function startOfficial() {

  let selected = [];

  for (let unit = 1; unit <= 5; unit++) {

    const pool =
      QUESTION_BANK.filter(
        q => q.unit === unit
      );

    selected.push(
      ...sample(
        pool,
        OFFICIAL_COUNTS[unit]
      )
    );
  }

  currentQuestions =
    shuffle(selected);

  startExam(
    "正式模擬考｜40題",
    105
  );
}


function startPractice(count) {

  currentQuestions =
    sample(
      QUESTION_BANK,
      count
    );

  startExam(
    count + " 題強化練習",
    0
  );
}


function startUnit(unit) {

  const pool =
    QUESTION_BANK.filter(
      q => q.unit === unit
    );

  currentQuestions =
    sample(pool, 40);

  startExam(
    "單元 " +
    unit +
    " 專攻",
    0
  );
}


function startWrong() {

  const wrongIDs =
    JSON.parse(
      localStorage.getItem(
        "wrongQuestions"
      ) || "[]"
    );

  if (!wrongIDs.length) {

    alert(
      "目前沒有錯題。"
    );

    return;
  }

  currentQuestions =
    QUESTION_BANK.filter(
      q =>
        wrongIDs.includes(q.id)
    );

  startExam(
    "錯題重練",
    0
  );
}


function startExam(title, minutes) {

  answers = {};

  document
    .getElementById("home")
    .classList.add("hidden");

  document
    .getElementById("exam")
    .classList.remove("hidden");

  document
    .getElementById("result")
    .classList.add("hidden");

  document
    .getElementById("modeTitle")
    .innerText = title;

  renderQuestions();

  startTimer(minutes);

  window.scrollTo(0,0);
}


function renderQuestions() {

  const box =
    document.getElementById(
      "questions"
    );

  box.innerHTML = "";

  currentQuestions.forEach(
    (q, index) => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "question";

      const options =
        shuffle(q.options);

      let optionHTML = "";

      options.forEach(
        (option, i) => {

          optionHTML += `
          <label class="option">

            <input
            type="radio"
            name="q${index}"
            value="${option}"
            onchange="saveAnswer('${q.id}',this.value)"
            >

            ${String.fromCharCode(65+i)}.
            ${option}

          </label>
          `;
        }
      );

      div.innerHTML = `

      <div class="question-title">

      第 ${index+1} 題

      ｜單元 ${q.unit}

      ｜${q.topic}

      </div>

      <div>

      ${q.stem}

      </div>

      ${optionHTML}

      <div
      id="exp-${index}"
      class="explain hidden">
      </div>

      `;

      box.appendChild(div);

    }
  );
}


function saveAnswer(id, value) {

  answers[id] = value;

}


function submitExam() {

  clearInterval(timerID);

  let correct = 0;

  let unitStats = {};

  let wrongIDs =
    JSON.parse(
      localStorage.getItem(
        "wrongQuestions"
      ) || "[]"
    );

  currentQuestions.forEach(
    (q,index) => {

      if (!unitStats[q.unit]) {

        unitStats[q.unit] = {
          total:0,
          correct:0
        };

      }

      unitStats[q.unit].total++;

      const userAnswer =
        answers[q.id];

      const isCorrect =
        userAnswer === q.correct;

      if (isCorrect) {

        correct++;

        unitStats[q.unit]
        .correct++;

        wrongIDs =
          wrongIDs.filter(
            id =>
              id !== q.id
          );

      } else {

        if (
          !wrongIDs.includes(q.id)
        ) {

          wrongIDs.push(q.id);

        }

      }

      showExplanation(
        q,
        index,
        userAnswer,
        isCorrect
      );

    }
  );

  localStorage.setItem(
    "wrongQuestions",
    JSON.stringify(wrongIDs)
  );

  const percent =
    Math.round(
      correct /
      currentQuestions.length *
      100
    );

  showResult(
    correct,
    percent,
    unitStats
  );

}


function showExplanation(
  q,
  index,
  userAnswer,
  correct
) {

  const box =
    document.getElementById(
      "exp-" + index
    );

  box.classList.remove(
    "hidden"
  );

  box.innerHTML = `

  <b>
  ${correct
  ? "✅ 答對"
  : "❌ 答錯"}
  </b>

  <br>

  正確答案：
  <b>${q.correct}</b>

  <br>

  你的答案：
  <b>${userAnswer || "未作答"}</b>

  <br><br>

  <b>解析：</b>

  ${q.explanation}

  <br><br>

  <b>記憶口訣：</b>

  ${q.mnemonic}

  <br><br>

  <small>

  教材依據：
  ${q.source}

  </small>

  `;

}


function showResult(
  correct,
  percent,
  unitStats
) {

  const result =
    document.getElementById(
      "result"
    );

  result.classList.remove(
    "hidden"
  );

  let unitHTML = "";

  for (
    let unit = 1;
    unit <= 5;
    unit++
  ) {

    if (
      !unitStats[unit]
    ) continue;

    const data =
      unitStats[unit];

    const p =
      Math.round(
        data.correct /
        data.total *
        100
      );

    unitHTML += `

    <div
    class="unit-result">

    單元 ${unit}

    ｜${data.correct}
    /
    ${data.total}

    ｜${p}%

    </div>

    `;
  }

  let pass =
    percent >= 80;

  if (
    currentQuestions.length === 40
  ) {

    for (
      let unit=1;
      unit<=5;
      unit++
    ) {

      const d =
        unitStats[unit];

      if (
        d &&
        d.correct /
        d.total <
        0.5
      ) {

        pass = false;

      }

    }

  }

  result.innerHTML = `

  <div class="score">

  ${percent}%

  </div>

  <h2>

  ${pass
  ? "✅ PASS"
  : "❌ FAIL"}

  </h2>

  <p>

  答對：

  ${correct}

  /

  ${currentQuestions.length}

  </p>

  ${unitHTML}

  <br>

  <button
  class="warning"
  onclick="startWrong()">

  錯題重練

  </button>

  <button
  class="secondary"
  onclick="backHome()">

  回首頁

  </button>

  `;

  result.scrollIntoView({
    behavior:"smooth"
  });

}


function startTimer(minutes) {

  clearInterval(timerID);

  if (!minutes) {

    document.getElementById(
      "timer"
    ).innerText =
      "不限時";

    return;
  }

  timeLeft =
    minutes * 60;

  timerID =
    setInterval(
      () => {

        const m =
          Math.floor(
            timeLeft /
            60
          );

        const s =
          timeLeft %
          60;

        document
        .getElementById(
          "timer"
        )
        .innerText =
          String(m)
          .padStart(2,"0")
          +
          ":"
          +
          String(s)
          .padStart(2,"0");

        timeLeft--;

        if (
          timeLeft <
          0
        ) {

          clearInterval(
            timerID
          );

          alert(
            "時間到，自動交卷。"
          );

          submitExam();

        }

      },
      1000
    );

}


function backHome() {

  clearInterval(timerID);

  document
    .getElementById("exam")
    .classList.add("hidden");

  document
    .getElementById("home")
    .classList.remove("hidden");

  window.scrollTo(0,0);

}

</script>

</body>
</html>
